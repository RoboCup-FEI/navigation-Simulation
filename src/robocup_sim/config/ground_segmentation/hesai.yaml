ground_segmentation:
  ros__parameters:
    # pre/post processing
    robot_frame: "base_link"
    maxX: 15.0
    minX: -15.0
    maxY: 15.0
    minY: -15.0
    maxZ: 2.5
    minZ: -1.0
    downsample: false
    downsample_resolution: 0.1
    # hesai_frame (Hesai XT16 modelu v2) je 0.449 m nad podlahou:
    lidar_to_ground: -0.449
    transform_tolerance: 0.1

    ##ground detection
    cellSizeX: 1.0
    cellSizeY: 1.0
    cellSizeZ: 10.0
    cellSizeZPhase2: 1.0
    slopeThresholdDegrees: 20.0
    groundInlierThreshold: 0.1
    centroidSearchRadius: 5.0
    use_imu_orientation: false
    maxGroundHeightDeviation: 0.1

    #debug
    show_benchmark: false
